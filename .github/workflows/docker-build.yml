name: Build, Push, and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/adilaljasem/arenasurvivor:latest

      # 1. Copy the updated docker-compose.yml to the server
      - name: Copy Compose File to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          source: "docker-compose.yml"
          target: "/home/adil/"

      # 2. SSH in, pull the latest images, and redeploy the entire stack
      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          script: |
            # Navigate to where the compose file was copied
            cd /home/adil/
            
            # Explicitly pull the latest images so Swarm gets the newest digest
            docker pull ghcr.io/adilaljasem/arenasurvivor:latest
            
            # Deploy the whole stack (Applies YAML changes AND updates images)
            docker stack deploy -c docker-compose.yml arena_stack --with-registry-auth