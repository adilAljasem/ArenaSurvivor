name: Build, Push, and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/adilaljasem/arenasurvivor:latest

      # 1. Copy the updated arena-stack.yml to the server
      - name: Copy Stack File to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          source: "arena-stack.yml"
          target: "/home/adil/"

      # 2. SSH in, pull the latest images, and redeploy the entire stack
      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          script: |
            # Navigate to where the stack file was copied
            cd /home/adil/
            
            # Ensure external overlay networks exist before deploying
            docker network inspect traefik_public >/dev/null 2>&1 || docker network create --driver=overlay --attachable traefik_public
            docker network inspect yb_network >/dev/null 2>&1 || docker network create --driver=overlay --attachable yb_network
            
            # Explicitly pull the latest images so Swarm gets the newest digest
            docker pull ghcr.io/adilaljasem/arenasurvivor:latest
            
            # Deploy the whole stack (Applies YAML changes AND updates images)
            docker stack deploy -c arena-stack.yml arena_stack --with-registry-auth
            docker stack deploy -c arena-stack.yml arena_stack --with-registry-auth
